<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پورتفولیو ابوالفضل</title>
    
    <!-- لود فونت تمیز فارسی از گوگل -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Vazirmatn', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* نوار منو */
        nav {
            width: 100%;
            background-color: #0d0d0d;
            border-bottom: 2px solid #00ff00;
            padding: 14px 0;
            position: sticky;
            top: 0;
        }

        .nav-links {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .nav-links a {
            color: #00ff00;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            padding: 6px 14px;
            border: 1px solid #00ff00;
            border-radius: 6px;
        }

        .nav-links a:hover {
            background-color: #00ff00;
            color: #000000;
        }

        /* کادر اصلی */
        .card {
            width: 90%;
            max-width: 450px;
            margin-top: 35px;
            padding: 25px;
            background-color: #0c0c0c;
            border: 2px solid #00ff00;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            text-align: center;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .info-row {
            margin: 10px 0;
            font-size: 15px;
            color: #c9ffc9;
        }

        .separator {
            border: none;
            border-top: 1px dashed #00ff00;
            margin: 20px 0;
        }

        button {
            background-color: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        button:active {
            background-color: #00ff00;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- بخش منو -->
    <nav>
        <div class="nav-links">
            <a href="#home">خانه</a>
            <a href="#skills">مهارت‌ها</a>
            <a href="#projects">پروژه‌ها</a>
            <a href="#contact">تماس</a>
        </div>
    </nav>

    <!-- کادر مشخصات -->
    <div class="card" id="home">
        <h1>> وضعیت سیستم: آنلاین</h1>
        
        <div class="info-row"><strong>نام کاربر:</strong> ابوالفضل</div>
        <div class="info-row"><strong>تخصص:</strong> پایتون و امنیت شبکه</div>
        <div class="info-row"><strong>سطح دسترسی:</strong> ادمین اصلی</div>

        <hr class="separator">

        <button onclick="alert('اسکن امنیتی با موفقیت انجام شد.')">
            اجرای اسکن
        </button>
    </div>

</body>
</html>
